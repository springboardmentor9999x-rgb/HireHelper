<div class="dashboard-layout" [class.sidebar-open]="sidebarOpen()">

    <!-- Mobile overlay -->
    @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
    }

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar">
        <!-- Brand -->
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M20 7H4C2.9 7 2 7.9 2 9V19C2 20.1 2.9 21 4 21H20C21.1 21 22 20.1 22 19V9C22 7.9 21.1 7 20 7Z"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M16 21V5C16 3.9 15.1 3 14 3H10C8.9 3 8 3.9 8 5V21" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <span class="brand-text">HireHelper</span>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
            <span class="nav-section-label">Main</span>

            <a routerLink="overview" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Overview</span>
            </a>

            <a routerLink="feed" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3Z"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M3 9H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M9 21V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span>Feed</span>
            </a>

            <a routerLink="my-tasks" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M9 11L12 14L22 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M21 12V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H16"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>My Tasks</span>
            </a>

            <a routerLink="requests" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M21 15C21 15.53 20.79 16.04 20.41 16.41C20.04 16.79 19.53 17 19 17H7L3 21V5C3 4.47 3.21 3.96 3.59 3.59C3.96 3.21 4.47 3 5 3H19C19.53 3 20.04 3.21 20.41 3.59C20.79 3.96 21 4.47 21 5V15Z"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Requests</span>
            </a>

            <a routerLink="my-requests" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M17 21V19C17 17.94 16.58 16.92 15.83 16.17C15.08 15.42 14.06 15 13 15H5C3.94 15 2.92 15.42 2.17 16.17C1.42 16.92 1 17.94 1 19V21"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.8" />
                    <path d="M23 21V19C22.99 18.11 22.67 17.25 22.1 16.57C21.53 15.88 20.74 15.41 19.86 15.23"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    <path
                        d="M16 3.13C16.88 3.31 17.68 3.78 18.25 4.47C18.82 5.15 19.14 6.01 19.14 6.9C19.14 7.79 18.82 8.65 18.25 9.33C17.68 10.02 16.88 10.49 16 10.67"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>My Requests</span>
            </a>

            <a routerLink="notifications" routerLinkActive="active" class="nav-item" (click)="closeSidebar()" style="justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 0.85rem;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Notifications</span>
                </div>
                @if (unreadCount() > 0) {
                    <span class="badge" style="background: rgba(108,71,255,0.2); color: #c4b5fd; padding: 0.15rem 0.5rem; border-radius: 12px; font-size: 0.75rem; font-weight: 700;">{{ unreadCount() }}</span>
                }
            </a>

            <span class="nav-section-label">Actions</span>

            <a routerLink="add-task" routerLinkActive="active" class="nav-item accent-item" (click)="closeSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8" />
                    <path d="M12 8V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M8 12H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span>Add Task</span>
            </a>

            <a routerLink="settings" routerLinkActive="active" class="nav-item" (click)="closeSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Settings</span>
            </a>
        </nav>

        <!-- User section at bottom -->
        <div class="sidebar-footer">
            <div class="user-badge">
                <div class="avatar">{{ userInitial }}</div>
                <div class="user-info">
                    <span class="user-name">{{ userName }}</span>
                    <span class="user-role">Member</span>
                </div>
            </div>
            <button class="logout-btn" (click)="logout()" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M9 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H9" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" />
                </svg>
            </button>
        </div>
    </aside>

    <!-- ═══ MAIN AREA ═══ -->
    <div class="main-area">
        <!-- Top bar (mobile) -->
        <header class="topbar">
            <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <span class="topbar-title">HireHelper</span>
            <div class="topbar-avatar" (click)="logout()" title="Logout">{{ userInitial }}</div>
        </header>

        <!-- Page content -->
        <main class="content">
            <router-outlet />
        </main>
    </div>
</div>
