<div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Notifications</h1>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-12">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && notifications.length === 0" class="text-center py-12 bg-white rounded-lg shadow-sm border border-gray-200">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No notifications</h3>
        <p class="mt-1 text-sm text-gray-500">You're all caught up!</p>
    </div>

    <!-- Notifications List -->
    <div *ngIf="!loading && notifications.length > 0" class="bg-white shadow overflow-hidden sm:rounded-md border border-gray-200">
        <ul role="list" class="divide-y divide-gray-200">
            <li *ngFor="let notification of notifications" (click)="!notification.is_read && markAsRead(notification.id)">
                <div [ngClass]="{'bg-indigo-50': !notification.is_read}" class="px-4 py-4 sm:px-6 hover:bg-gray-50 transition duration-150 ease-in-out cursor-pointer">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <div *ngIf="!notification.is_read" class="flex-shrink-0 mr-2">
                                <span class="h-2 w-2 rounded-full bg-indigo-600 inline-block"></span>
                            </div>
                            <p class="text-sm font-medium text-gray-900">{{ notification.body }}</p>
                        </div>
                        <div class="ml-2 flex-shrink-0 flex">
                            <p class="text-xs text-gray-500">
                                {{ notification.created_at | date:'short' }}
                            </p>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</div>
