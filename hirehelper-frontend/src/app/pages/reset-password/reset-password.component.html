<div class="min-h-screen flex items-center justify-center bg-background p-4 sm:p-6 lg:p-8">
  <div class="w-full max-w-lg bg-white rounded-lg shadow-xl border border-border overflow-hidden animate-fade-in text-center p-8 lg:p-12">
    @if (!isSuccess()) {
      <div class="mb-10 animate-slide-up">
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Security Update</h1>
        <p class="text-brand-muted mt-2">Initialize a new secure password for your account.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
        <div class="space-y-1.5 text-left animate-slide-up delay-100">
          <label for="password" class="text-xs font-bold text-brand-secondary/80 uppercase tracking-widest ml-1">New Password</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-brand-muted">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m6-6H6a2 2 0 00-2 2v6a2 2 0 002 2h12a2 2 0 002-2v-6a2 2 0 00-2-2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </span>
            <input type="password" id="password" name="password" [(ngModel)]="password" required
              class="w-full pl-11 pr-4 py-3.5 bg-white border border-border rounded focus:ring-4 focus:ring-accent/5 focus:border-accent outline-none transition-all placeholder:text-slate-300 text-sm"
              placeholder="••••••••">
          </div>
        </div>

        <div class="space-y-1.5 text-left animate-slide-up delay-150">
          <label for="confirmPassword" class="text-xs font-bold text-brand-secondary/80 uppercase tracking-widest ml-1">Confirm Identity</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-brand-muted">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
              </svg>
            </span>
            <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required
              class="w-full pl-11 pr-4 py-3.5 bg-white border border-border rounded focus:ring-4 focus:ring-accent/5 focus:border-accent outline-none transition-all placeholder:text-slate-300 text-sm"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" [disabled]="isLoading() || !password || !confirmPassword"
          class="w-full bg-brand-primary hover:bg-brand-primary-hover text-white font-bold py-4 rounded shadow-lg shadow-brand-primary/10 transition-all active:scale-[0.98] animate-slide-up delay-200 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Updating Security...
          } @else {
            Update Password
          }
        </button>

        <a routerLink="/login" class="block text-sm font-bold text-accent hover:underline mt-6 animate-slide-up delay-300">
          Cancel & Return to Identity Portal
        </a>
      </form>
    } @else {
      <div class="animate-slide-up">
        <div class="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-8 border border-green-100 shadow-sm transition-all scale-110">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight mb-2">Password Secure</h1>
        <p class="text-brand-muted leading-relaxed mb-10">Verification complete. Redirecting you to the login portal...</p>
        <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
          <div class="bg-brand-primary h-full animate-loading-bar"></div>
        </div>
      </div>
    }
  </div>
</div>
