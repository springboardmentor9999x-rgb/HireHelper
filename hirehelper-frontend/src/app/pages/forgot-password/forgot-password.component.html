<div class="min-h-screen flex items-center justify-center bg-background p-4 sm:p-6 lg:p-8">
  <div class="w-full max-w-lg bg-white rounded-lg shadow-xl border border-border overflow-hidden animate-fade-in text-center p-8 lg:p-12">
    @if (!isSubmitted()) {
      <div class="mb-10 animate-slide-up">
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Recover Access</h1>
        <p class="text-brand-muted mt-2">Enter your work email to receive a secure reset link.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6" novalidate>
        <div class="space-y-1.5 text-left animate-slide-up delay-100">
          <label for="email" class="text-xs font-bold text-brand-secondary/80 uppercase tracking-widest ml-1">Work Email</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-brand-muted">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
            </span>
            <input type="email" id="email" name="email" [(ngModel)]="email" required
              class="w-full pl-11 pr-4 py-3.5 bg-white border border-border rounded focus:ring-4 focus:ring-accent/5 focus:border-accent outline-none transition-all placeholder:text-slate-300 text-sm"
              placeholder="name@company.com">
          </div>
        </div>

        <button type="submit" [disabled]="isLoading() || !email"
          class="w-full bg-brand-primary hover:bg-brand-primary-hover text-white font-bold py-4 rounded shadow-lg shadow-brand-primary/10 transition-all active:scale-[0.98] animate-slide-up delay-200 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            Requesting...
          } @else {
            Send Reset Link
          }
        </button>

        <a routerLink="/login" class="block text-sm font-bold text-accent hover:underline mt-6 animate-slide-up delay-300">
          Back to Login
        </a>
      </form>
    } @else {
      <div class="animate-slide-up">
        <div class="w-20 h-20 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-8 border border-green-100 shadow-sm">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight mb-2">Check Your Email</h1>
        <p class="text-brand-muted leading-relaxed mb-10">We've sent a secure reset link to <strong class="text-slate-800">{{ email }}</strong>. Please check your inbox and spam folder.</p>
        <button (click)="isSubmitted.set(false)" class="w-full bg-brand-primary hover:bg-brand-primary-hover text-white font-bold py-4 rounded shadow-lg transition-all mb-4">
          Resend Link
        </button>
        <a routerLink="/login" class="block text-sm font-bold text-accent hover:underline">
          Return to Identity Portal
        </a>
      </div>
    }
  </div>
</div>
