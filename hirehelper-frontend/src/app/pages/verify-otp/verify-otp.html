<div class="min-h-screen flex items-center justify-center bg-background p-4 sm:p-6 lg:p-8">
  <div
    class="w-full max-w-4xl bg-white rounded-lg shadow-xl shadow-slate-200/50 border border-border overflow-hidden flex flex-col md:flex-row animate-fade-in">
    <!-- Corporate Side Panel -->
    <div class="hidden md:flex md:w-[45%] bg-brand-primary p-12 text-white flex-col justify-between relative">
      <div class="absolute inset-0 opacity-10 pointer-events-none animate-float">
        <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
          <path d="M0 0 L100 0 L100 100 Z" fill="currentColor"></path>
        </svg>
      </div>

      <div class="relative z-10">
        <div class="mb-12">
          <span class="text-xl font-bold uppercase tracking-[0.3em] text-white/60">HireHelper</span>
        </div>
        <h2 class="text-4xl lg:text-5xl font-bold leading-tight tracking-tight">Security <br>First.</h2>
        <p class="mt-6 text-slate-300 text-lg font-light leading-relaxed max-w-xs">Verifying your identity to ensure the
          highest standards of organizational safety.</p>
      </div>

      <div class="relative z-10 pt-12 border-t border-white/10">
        <div class="flex items-center space-x-4">
          <div class="w-10 h-10 rounded bg-white/10 flex items-center justify-center">
            <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
              </path>
            </svg>
          </div>
          <div>
            <h4 class="text-sm font-semibold">Identity Verification</h4>
            <p class="text-white/40 text-[10px] uppercase tracking-wider">Multi-factor authentication</p>
          </div>
        </div>
      </div>
    </div>

    <!-- OTP Form Side -->
    <div class="w-full md:w-[55%] p-8 lg:p-16 flex flex-col justify-center">
      <div class="mb-10 text-center md:text-left animate-slide-up">
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Verify Email</h1>
        <p class="text-brand-muted mt-2">We've sent a 6-digit verification code to <span
            class="text-slate-900 font-semibold">{{ email }}</span></p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="space-y-1.5 animate-slide-up delay-100">
          <label for="otp" class="text-xs font-bold text-brand-secondary/80 uppercase tracking-widest ml-1">Verification
            Code</label>
          <div class="relative group">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-brand-muted">
              <svg class="w-4 h-4 transition-colors group-focus-within:text-accent" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 003.111 12.447m16.946 8.384l-.553-1.21a10.034 10.034 0 01-5.148-5.413M7.5 15h.01m4.49 0h.01m4.49 0h.01M12 12V3m0 0l3 3m-3-3l-3 3">
                </path>
              </svg>
            </span>
            <input type="text" id="otp" name="otp" [(ngModel)]="otp" maxlength="6"
              class="w-full pl-11 pr-4 py-4 bg-white border border-border rounded focus:ring-4 focus:ring-accent/5 focus:border-accent outline-none transition-all placeholder:text-slate-300 text-center text-2xl tracking-[0.5em] font-mono"
              placeholder="000000" required autofocus>
          </div>
        </div>


        <button type="submit" [disabled]="isLoading() || !otp"
          class="w-full bg-brand-primary hover:bg-brand-primary-hover disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-4 rounded shadow-lg shadow-brand-primary/10 transition-all active:scale-[0.98] animate-slide-up delay-200">
          {{ isLoading() ? 'Verifying...' : 'Verify Access' }}
        </button>

        <div class="flex flex-col space-y-4 pt-4 border-t border-slate-100 animate-slide-up delay-300">
          <p class="text-center text-sm text-brand-muted">
            Didn't receive the code?
            <button type="button" (click)="resendOTP()" [disabled]="resendCountdown() > 0 || isLoading()"
              class="text-accent font-bold hover:underline decoration-2 underline-offset-4 ml-1 disabled:opacity-50 disabled:cursor-not-allowed">
              {{ resendCountdown() > 0 ? 'Resend Code in ' + resendCountdown() + 's' : 'Resend Code' }}
            </button>
          </p>
          <a routerLink="/login"
            class="text-center text-xs font-semibold text-brand-muted hover:text-accent transition-colors">
            Back to Sign In
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
