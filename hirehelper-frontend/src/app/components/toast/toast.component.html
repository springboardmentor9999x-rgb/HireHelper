<div class="fixed top-6 right-6 z-[9999] flex flex-col gap-4 pointer-events-none">
  @for (toast of toasts(); track toast.id) {
  <div
    class="pointer-events-auto min-w-[320px] max-w-md p-4 rounded bg-white shadow-2xl border flex items-center gap-4 animate-slide-in overflow-hidden relative"
    [ngClass]="{
        'border-emerald-100 bg-emerald-50/10': toast.type === 'success',
        'border-red-100 bg-red-50/10': toast.type === 'error',
        'border-slate-100 bg-slate-50/10': toast.type === 'info'
      }">
    
    <!-- Accent Line -->
    <div class="absolute inset-y-0 left-0 w-1.5"
      [ngClass]="{
        'bg-accent': toast.type === 'success',
        'bg-red-500': toast.type === 'error',
        'bg-brand-primary': toast.type === 'info'
      }">
    </div>

    <!-- Icon -->
    <div class="flex-shrink-0 w-10 h-10 rounded flex items-center justify-center"
      [ngClass]="{
        'bg-accent/10 text-accent': toast.type === 'success',
        'bg-red-50/50 text-red-600': toast.type === 'error',
        'bg-brand-primary/10 text-brand-primary': toast.type === 'info'
      }">
      @if (toast.type === 'success') {
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
      </svg>
      } @else if (toast.type === 'error') {
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      } @else {
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      }
    </div>

    <!-- Content -->
    <div class="flex-grow pr-2">
      <h4 class="text-xs font-bold uppercase tracking-widest mb-0.5"
        [ngClass]="{
          'text-accent': toast.type === 'success',
          'text-red-600': toast.type === 'error',
          'text-brand-primary': toast.type === 'info'
        }">
        {{ toast.type === 'success' ? 'Success' : toast.type === 'error' ? 'Notification' : 'Information' }}
      </h4>
      <p class="text-brand-secondary text-sm font-medium leading-relaxed">{{ toast.message }}</p>
    </div>

    <!-- Close Button -->
    <button (click)="dismiss(toast.id)" class="text-slate-300 hover:text-slate-500 transition-colors p-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
  }
</div>
