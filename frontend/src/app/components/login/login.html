<div class="auth-page">

  <div class="auth-card">

    <h1 class="title">HireHelper</h1>
    <h3 class="subtitle">Login</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          class="form-input"
          placeholder="Enter your email"
          formControlName="email"
          [class.is-invalid]="submitted && f['email'].invalid"
        />
        <div *ngIf="submitted && f['email'].invalid" class="error-text">
          <span *ngIf="f['email'].errors?.['required']">Email is required</span>
          <span *ngIf="f['email'].errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          class="form-input"
          placeholder="Enter your password"
          formControlName="password"
          [class.is-invalid]="submitted && f['password'].invalid"
        />
        <div *ngIf="submitted && f['password'].invalid" class="error-text">
          <span *ngIf="f['password'].errors?.['required']">Password is required</span>
          <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <button type="submit" class="login-btn" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'LOGIN' }}
      </button>

      <p class="forgot-password-link">
        <a routerLink="/forgot-password">Forgot your password?</a>
      </p>

      <p class="register-link">
        Don't have an account?
        <a routerLink="/register">Register here</a>
      </p>

    </form>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

  </div>

</div>
