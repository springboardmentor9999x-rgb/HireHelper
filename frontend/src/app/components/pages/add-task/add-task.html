<div class="page card fade-in">
  <h2>Add New Task</h2>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-error">
    {{ errorMessage }}
  </div>

  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">

    <!-- Title -->
    <div class="form-group">
      <label for="title">Title *</label>
      <input
        type="text"
        id="title"
        formControlName="title"
        class="form-control"
        placeholder="Enter task title"
        required
      />
      <small class="error-text" *ngIf="isFieldInvalid('title')">
        {{ getFieldError('title') }}
      </small>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="description">Description *</label>
      <textarea
        id="description"
        formControlName="description"
        class="form-control"
        placeholder="Enter task description (minimum 10 characters)"
        rows="4"
        required
      ></textarea>
      <small class="error-text" *ngIf="isFieldInvalid('description')">
        {{ getFieldError('description') }}
      </small>
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="category">Category *</label>
      <select
        id="category"
        formControlName="category"
        class="form-control"
        required
      >
        <option value="" disabled selected>-- Select a category --</option>
        <option *ngFor="let cat of taskCategories" [value]="cat">{{ cat }}</option>
      </select>
      <small class="error-text" *ngIf="isFieldInvalid('category')">
        {{ getFieldError('category') }}
      </small>
    </div>

    <!-- Location -->
    <div class="form-group">
      <label for="location">Location *</label>
      <input
        type="text"
        id="location"
        formControlName="location"
        class="form-control"
        placeholder="Enter location"
        required
      />
      <small class="error-text" *ngIf="isFieldInvalid('location')">
        {{ getFieldError('location') }}
      </small>
    </div>

    <!-- Budget -->
    <div class="form-group">
      <label for="budget">Budget (Optional)</label>
      <input
        type="number"
        id="budget"
        formControlName="budget"
        class="form-control"
        placeholder="Enter budget amount"
        step="0.01"
      />
    </div>

    <!-- Start Time -->
    <div class="form-group">
      <label for="start_time">Start Time *</label>
      <input
        type="datetime-local"
        id="start_time"
        formControlName="start_time"
        class="form-control"
        required
      />
      <small class="error-text" *ngIf="isFieldInvalid('start_time')">
        {{ getFieldError('start_time') }}
      </small>
    </div>

    <!-- End Time -->
    <div class="form-group">
      <label for="end_time">End Time (Optional)</label>
      <input
        type="datetime-local"
        id="end_time"
        formControlName="end_time"
        class="form-control"
      />
    </div>

    <!-- Image Upload -->
    <div class="form-group">
      <label for="image">Task Image (Optional)</label>
      <input
        type="file"
        id="image"
        accept="image/*"
        (change)="onImageSelected($event)"
        class="form-control"
        placeholder="Choose image"
      />
      <small class="help-text" *ngIf="selectedImage">
        📸 Image selected: {{ selectedImage.name }}
      </small>
    </div>

    <!-- Form Actions -->
    <div class="button-group">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? '⏳ Creating...' : '✅ Create Task' }}
      </button>
      <button type="button" class="btn btn-cancel" (click)="onCancel()">
        ✕ Cancel
      </button>
    </div>

  </form>
</div>
