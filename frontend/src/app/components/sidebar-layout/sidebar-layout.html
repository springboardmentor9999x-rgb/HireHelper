<div class="min-h-screen flex app-shell relative overflow-x-hidden" [class.theme-dark]="isDarkTheme">
  <aside class="w-64 flex flex-col shadow-sm shrink-0 sticky top-0 h-screen sidebar-shell transition-all duration-300 ease-in-out z-40 bg-white dark:bg-slate-900 border-r border-slate-100 dark:border-slate-800"
    [ngClass]="{'-ml-64': !isSidebarOpen}">
    <div class="p-6 border-b section-divider">
      <h1 class="text-2xl font-black tracking-tight title-text">HireHelper</h1>
      <p class="text-xs mt-0.5 subtitle-text">Workspace</p>
    </div>

    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a routerLink="/dashboard" routerLinkActive="!bg-blue-600 !text-white"
        class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition">
        Dashboard
      </a>

      <a routerLink="/feed" routerLinkActive="!bg-blue-600 !text-white"
        class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition">
        Task Feed
      </a>

      <ng-container *ngIf="isEmployer">
        <a routerLink="/add-task" routerLinkActive="!bg-blue-600 !text-white"
          class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition">
          Add Task
        </a>
        <a routerLink="/my-tasks" routerLinkActive="!bg-blue-600 !text-white"
          class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition">
          My Tasks
        </a>
        <a routerLink="/requests" routerLinkActive="!bg-blue-600 !text-white"
          class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition">
          Requests
        </a>
      </ng-container>

      <ng-container *ngIf="isHelper">
        <a routerLink="/my-requests" routerLinkActive="!bg-blue-600 !text-white"
          class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition">
          My Requests
        </a>
      </ng-container>

      <a (click)="viewNotifications()" class="nav-link flex items-center justify-between px-4 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800">
        <div class="flex items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notifications</span>
        </div>
        <span *ngIf="unreadCount > 0" class="bg-red-500 text-white text-[10px] leading-tight font-bold px-1.5 py-0.5 rounded-full">
          {{ unreadCount }}
        </span>
      </a>

      <a routerLink="/settings" routerLinkActive="!bg-blue-600 !text-white"
        class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition">
        Settings
      </a>
    </nav>

    <div class="p-4 border-t section-divider">
      <div class="flex items-center gap-3 mb-3">
        <img *ngIf="userProfilePicture" [src]="userProfilePicture" alt="Profile picture" class="w-10 h-10 rounded-full object-cover border border-slate-200" />
        <div *ngIf="!userProfilePicture" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm">
          {{ userName.charAt(0).toUpperCase() }}
        </div>
        <div>
          <p class="text-sm font-semibold title-text">
            {{ userName }}
            <span *ngIf="userRating" class="ml-1 text-yellow-500 text-xs text-nowrap">⭐ {{ userRating }}</span>
          </p>
          <p class="text-xs subtitle-text">{{ userEmail || (isEmployer ? 'Hirer' : 'Helper') }}</p>
        </div>
      </div>

      <button type="button" (click)="toggleTheme()"
        class="w-full h-9 rounded-xl border text-sm font-medium transition mb-2 action-btn">
        Switch to {{ isDarkTheme ? 'Light' : 'Dark' }} Theme
      </button>

      <button type="button" (click)="logout()"
        class="w-full h-9 rounded-xl border text-sm font-medium transition action-btn">
        Logout
      </button>
    </div>
  </aside>

  <!-- Sidebar Toggle Tab Button -->
  <button type="button" (click)="toggleSidebar()"
    class="fixed z-50 top-1/2 -translate-y-1/2 flex items-center justify-center w-6 h-12 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-md text-slate-500 hover:text-blue-600 transition-all duration-300 group focus:outline-none cursor-pointer rounded-r-lg border-l-0"
    [ngClass]="{
      'left-64': isSidebarOpen,
      'left-0': !isSidebarOpen
    }">
    <svg *ngIf="isSidebarOpen" class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <svg *ngIf="!isSidebarOpen" class="w-4 h-4 transition-transform group-hover:translate-x-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <main class="flex-1 h-screen overflow-y-auto content-shell transition-all duration-300 ease-in-out bg-slate-50 dark:bg-slate-950">
    <router-outlet></router-outlet>
  </main>
</div>
