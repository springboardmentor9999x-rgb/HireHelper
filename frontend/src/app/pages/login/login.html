<div class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-blue-50 via-indigo-50 to-slate-100">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

    <div class="text-center mb-6 pb-5 relative">
      <h1 class="text-4xl font-black text-slate-900 tracking-tight">HireHelper</h1>
      <p class="text-slate-500 text-sm mt-2">Your trusted hiring platform</p>
      <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-16 h-0.5 rounded-full bg-gradient-to-r from-blue-500 to-emerald-400"></div>
    </div>

    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
      <p class="text-gray-500 text-sm mt-1">Sign in to continue to your account</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="login()" class="space-y-4">

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address</label>
        <div class="relative">
          <input type="email" name="email" [(ngModel)]="loginData.email" #emailField="ngModel"
            required email placeholder="Enter your email"
            class="w-full h-12 border border-slate-300 rounded-xl px-4 pr-11 text-sm text-slate-900 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition" />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
        </div>
        <div class="text-red-500 text-xs mt-1" *ngIf="emailField.invalid && emailField.touched">
          <span *ngIf="emailField.errors?.['required']">Email is required</span>
          <span *ngIf="emailField.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="loginData.password" #passwordField="ngModel"
            required minlength="6" placeholder="Enter your password"
            class="w-full h-12 border border-slate-300 rounded-xl px-4 pr-11 text-sm text-slate-900 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition" />
          <button type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-blue-700 hover:text-blue-800">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div class="text-red-500 text-xs mt-1" *ngIf="passwordField.invalid && passwordField.touched">
          <span *ngIf="passwordField.errors?.['required']">Password is required</span>
          <span *ngIf="passwordField.errors?.['minlength']">At least 6 characters</span>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
          <input type="checkbox" name="rememberMe" class="accent-blue-600 w-4 h-4" />
          <span>Remember me</span>
        </label>
        <a routerLink="/forgot-password" class="text-sm font-semibold text-blue-700 hover:underline">Forgot Password?</a>
      </div>

      <button type="submit" [disabled]="loginForm.invalid"
        class="w-full h-12 rounded-xl bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-200 hover:-translate-y-0.5 transition disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
        <span>Sign In</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-5">
      Don't have an account? <a routerLink="/register" class="text-blue-700 font-bold hover:underline cursor-pointer">Sign Up</a>
    </p>
  </div>
</div>
