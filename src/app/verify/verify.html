<div class="verify-page">
  <div class="verify-card">

    <div class="brand-section">
      <h1 class="brand-title">HireHelper</h1>
      <p class="brand-subtitle">Verify your account to continue</p>
    </div>

    <div class="form-section">
      <h2>Verify Your Account</h2>
      <p class="info-text">
        Enter your registered email and the OTP sent to your email address.
      </p>

      <form (ngSubmit)="verifyAccount()" class="verify-form">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="input-group">
          <label for="otp">OTP</label>
          <input
            id="otp"
            type="text"
            name="otp"
            [(ngModel)]="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            required
          />
        </div>

        <button type="submit" class="verify-btn" [disabled]="loading">
          {{ loading ? 'Verifying...' : 'Verify Account' }}
        </button>

        <button
          type="button"
          class="resend-btn"
          (click)="resendOtp()"
          [disabled]="resendLoading"
        >
          {{ resendLoading ? 'Sending...' : 'Resend OTP' }}
        </button>
      </form>

      <p class="success-text" *ngIf="message">{{ message }}</p>
      <p class="error-text" *ngIf="errorMsg">{{ errorMsg }}</p>

      <p class="bottom-text">
        Back to <a routerLink="/login">Login</a>
      </p>
    </div>

  </div>
</div>
