<div class="page-shell">
  <div class="page-topbar">
    <button class="back-btn" (click)="goBack()">← Back</button>

    <div class="page-title-wrap">
      <h2>Notifications</h2>
      <p>Track all request and task updates here.</p>
    </div>
  </div>

  <div *ngIf="loading" class="glass-card empty-state">
    Loading notifications...
  </div>

  <div *ngIf="!loading && errorMessage" class="glass-card empty-state">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && notifications.length === 0" class="glass-card empty-state">
    No notifications yet.
  </div>

  <div class="page-list" *ngIf="!loading && notifications.length > 0">
    <div
      class="glass-card notification-item"
      *ngFor="let item of notifications"
      [class.unread]="!item.is_read"
    >
      <div>
        <p class="notification-message">{{ item.message }}</p>
        <p class="notification-time">{{ item.created_at | date:'medium' }}</p>
      </div>

      <button
        *ngIf="!item.is_read"
        class="primary-btn"
        (click)="markAsRead(item.id)"
      >
        Mark as read
      </button>
    </div>
  </div>
</div>
