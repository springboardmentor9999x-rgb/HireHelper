<div class="add-task-page">
  <div class="add-task-header">
    <div class="title-section">
      <button class="back-btn" (click)="goBack()">
  ← Back to Dashboard
</button>
      <p class="subtitle">Post a new task</p>
      <h1>Add Task</h1>
      <p class="desc">
        Fill in the details below to create a new task and make it visible to helpers.
      </p>
    </div>

    <div class="summary-card">
      <span>Task Form</span>
      <h2>New</h2>
      <p>Create a task quickly</p>
    </div>
  </div>

  <div class="form-card">
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">

      <div class="form-grid">
        <div class="form-group full">
          <label>Title*</label>
          <input type="text" formControlName="title" placeholder="Enter task title" />
          <div class="field-error" *ngIf="taskForm.controls['title'].invalid && taskForm.controls['title'].touched">
            Title is required
          </div>
        </div>

        <div class="form-group full">
          <label>Description</label>
          <textarea formControlName="description" placeholder="Describe your task"></textarea>
        </div>

        <div class="form-group">
          <label>Location</label>
          <input type="text" formControlName="Loc" placeholder="Enter task location" />
        </div>

        <div class="form-group">
          <label>Picture URL</label>
          <input type="text" formControlName="picture" placeholder="Paste image URL (optional)" />
        </div>

        <div class="form-group">
          <label>Start Time*</label>
          <input type="datetime-local" formControlName="start_time" />
        </div>

        <div class="form-group">
          <label>End Time</label>
          <input type="datetime-local" formControlName="end_time" />
        </div>
      </div>

      <button type="submit">Add Task</button>
    </form>

    <p class="main-error">{{ errorMessage }}</p>
  </div>
</div>
